name: CI

# Safety net for every push/PR — typecheck, lint, and a real production
# build, so a broken commit is caught here instead of only being noticed
# after a manual `wrangler deploy` (see PRD.md's production-readiness plan).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy values — nothing here connects to anything real. Just enough
      # so a module-scope process.env read doesn't crash the build; the
      # app never queries a live DB or sends real email during `next build`
      # (all static content comes from lib/content/*.ts, not the database).
      DATABASE_URL: "postgresql://user:pass@localhost:5432/whhf"
      AUTH_SECRET: "ci-build-dummy-secret"
      RESEND_API_KEY: "re_dummy"
      RESEND_FROM_ADDRESS: "no-reply@example.com"
      CONTACT_INBOX_EMAIL: "contact@example.com"
      INBOUND_EMAIL_WEBHOOK_SECRET: "ci-dummy-secret"
      R2_ACCOUNT_ID: "dummy"
      R2_ACCESS_KEY_ID: "dummy"
      R2_SECRET_ACCESS_KEY: "dummy"
      R2_BUCKET_NAME: "dummy"
      R2_PUBLIC_URL: "https://example.com"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` fails here with EBADPLATFORM on @esbuild/aix-ppc64 — a
      # known npm/esbuild rough edge where a lockfile generated on one
      # platform (this one: Windows) can record optional-dependency
      # os/cpu metadata that trips npm ci's stricter validation on a
      # different platform (Linux, here), even though the actually-needed
      # linux-x64 binary resolves fine. `npm install` doesn't hit this.
      - run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whhf_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # An ephemeral, disposable database — created fresh for this job and
      # destroyed after. Never the real Supabase database. See e2e/README.md.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/whhf_e2e"
      AUTH_SECRET: "e2e-test-secret"
      RESEND_API_KEY: "re_dummy"
      RESEND_FROM_ADDRESS: "no-reply@example.com"
      CONTACT_INBOX_EMAIL: "contact@example.com"
      INBOUND_EMAIL_WEBHOOK_SECRET: "e2e-dummy-secret"
      R2_ACCOUNT_ID: "dummy"
      R2_ACCESS_KEY_ID: "dummy"
      R2_SECRET_ACCESS_KEY: "dummy"
      R2_BUCKET_NAME: "dummy"
      R2_PUBLIC_URL: "https://example.com"
      SEED_ADMIN_EMAIL: "e2e-admin@example.com"
      SEED_ADMIN_PASSWORD: "e2e-test-password-123"
      E2E_ADMIN_EMAIL: "e2e-admin@example.com"
      E2E_ADMIN_PASSWORD: "e2e-test-password-123"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # See the `ci` job's comment above — `npm ci` fails on this
      # Windows-generated lockfile under Linux with EBADPLATFORM.
      - run: npm install

      - name: Apply baseline schema to the ephemeral database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -f drizzle/migrations/0000_aberrant_toad.sql

      - name: Seed a throwaway admin account
        run: npm run db:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start app, wait for it, run E2E tests
        run: |
          npm run start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && break
            sleep 2
          done
          set +e
          npx playwright test
          TEST_EXIT=$?
          set -e
          kill "$SERVER_PID" 2>/dev/null || true
          exit $TEST_EXIT

  deploy-staging:
    # Auto-deploys to the staging Worker on every push to main, once the
    # real checks above are green — production stays a deliberate manual
    # `wrangler deploy` (no env flag). See docs/production-readiness.md
    # Phase 4: staging shares production's Hyperdrive config/KV namespace
    # and is isolated purely by DB_SCHEMA=staging (wrangler.jsonc env.staging).
    needs: [ci, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ENV: "staging"
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      # Real production values reused for staging — see wrangler.jsonc
      # env.staging comment for why no new Cloudflare resources exist.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Satisfies a Wrangler/OpenNext preflight check for a local Hyperdrive
      # emulation string — never actually connected to during a remote
      # deploy. See README.md ("On Windows...").
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - name: Build for staging
        run: npm run cf:build

      - name: Deploy to the staging Worker
        run: npx wrangler deploy --env staging

      - name: Smoke-test staging
        run: node scripts/smoke-test.js https://whhf-portal-staging.ironaliv.workers.dev
