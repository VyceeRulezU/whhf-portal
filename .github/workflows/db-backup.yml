name: Database Backup

# Supabase's free tier has no point-in-time recovery (see
# docs/production-readiness.md Phase 3) — this is the actual backup
# mechanism. Dumps the database and uploads it to R2 under db-backups/.
on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install postgresql-client (pg_dump)
        # ubuntu-latest's default postgresql-client is older than
        # Supabase's Postgres 17 server, and pg_dump refuses to run
        # against a newer server than itself — install from the official
        # PostgreSQL apt repo (PGDG) instead of Ubuntu's default one.
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # The versioned package doesn't take over the unversioned
          # `pg_dump` on PATH (that stays the older preinstalled one) —
          # prepend its actual bin dir so this job's later steps use v17.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump database and upload to R2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node scripts/db-backup.js
